$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "WIA554CI@NGtbh.hcqz",
        "password": "string",
        "tenant_slug": "string"
      }
