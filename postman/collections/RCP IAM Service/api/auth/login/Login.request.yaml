$kind: http-request
name: Login
description: |-
  One endpoint, two populations: requests carrying tenant_slug resolve
  against that tenant's users; requests without it resolve against the
  global pool. A portal user can never log in through the mobile path
  (and vice versa) because the lookups are disjoint by tenant_id.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"nimal@dro.lk\",\r

    \  \"password\": \"VolunteerPassword@123\"\r

    }"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: pm.environment.set("adminToken", pm.response.json().access_token);
    language: text/javascript
examples: ./.resources/Login.resources/examples
order: 1000
