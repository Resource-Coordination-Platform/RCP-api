$kind: http-request
url: "{{baseUrl}}/api/volunteer/profiles/me"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "base_district": "string",
      "city": "string",
      "available_status": false,
      "skills": [
        "string",
        "string"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Update My Profile.resources/examples
order: 3000
