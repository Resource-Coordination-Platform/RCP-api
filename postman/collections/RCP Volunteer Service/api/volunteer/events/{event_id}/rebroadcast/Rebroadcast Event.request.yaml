$kind: http-request
description: |-
  Re-run volunteer matching for still-open skill buckets (e.g. after
  volunteers declined, or new volunteers became available). Only valid
  when event status is DECLARED or BROADCASTING.
url: '{{baseUrl}}/api/volunteer/events/:event_id/rebroadcast'
method: POST
headers:
  Accept: application/json
pathVariables:
  event_id: 74d97a52-704c-fbf8-c761-84709815af07
auth:
  type: bearer
  credentials:
    token: '{{bearerToken}}'
examples: ./.resources/Rebroadcast Event.resources/examples
order: 1000
