$kind: http-request
name: Login
description: |-
  One endpoint, two populations: requests carrying tenant_slug resolve
  against that tenant's users; requests without it resolve against the
  global pool (mobile app).
url: "{{gatewayUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
     "tenant_slug": "colombo-relief",
     "email": "admin@colomborelief.org",
     "password": "SecurePassword123!"
    }
order: 4000
