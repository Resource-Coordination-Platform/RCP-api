$kind: http-request
name: Declare Event
description: Declare a disaster event. Matching fan-out happens asynchronously.
url: '{{gatewayUrl}}/api/volunteer/events'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Flood in Colombo District",
      "description": "Major flooding affecting residential areas",
      "source_district": "colombo",
      "broadcast_type": "RADIUS_L1",
      "target_districts": null,
      "requirements": [
        {
          "skill": "first_aid",
          "required_count": 10
        },
        {
          "skill": "rescue",
          "required_count": 5
        }
      ]
    }
order: 2000
