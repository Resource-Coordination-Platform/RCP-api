$kind: http-request
description: Reserve a quantity of an inventory item. Requires tenant_admin or coordinator role.
url: '{{baseUrl}}/api/inventory/items/:item_id/reserve'
method: POST
headers:
  Accept: application/json
pathVariables:
  item_id: c3f420bb-4c99-2d37-c9a8-fbbf2111f848
params:
  - key: quantity
    value: '10'
auth:
  type: bearer
  credentials:
    token: '{{bearerToken}}'
examples: ./.resources/Reserve Item.resources/examples
order: 1000
