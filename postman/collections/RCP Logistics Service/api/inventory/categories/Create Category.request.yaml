$kind: http-request
name: Create Category
url: "{{baseUrl}}/api/inventory/categories"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "Dry Rations",
      "description": "Essential dry food items and grains",
      "unit": "kg",
      "form_schema": null
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/Create Category.resources/examples
order: 2000
