name: rcp  #note:when you do a alembic migration please change database url from port 6543 to 5432 because in a migration pool connection(transition mode) not work...it require session mode with port 5432

x-common-env: &common-env
  RABBITMQ_URL: amqp://rcp:rcp_local_pw@rabbitmq:5672/rcp
  #RABBITMQ_URL: amqp://rcp:rcp_local_pw@172.19.0.2:5672/rcp
  JWT_JWKS_URL: http://iam:8000/.well-known/jwks.json  #This is not the local port.this is the docker port because rto service call to iam service through docker network.
  # migrations are the schema source of truth (defaults to false in code).
  AUTO_CREATE_TABLES: "true"

services:

  # අලුතෙන් මේක add කරන්න
  cloudflared:
    image: cloudflare/cloudflared:latest
    # මෙතන 'api-gateway' වෙනුවට ඔයාගේ main service එකේ නම දෙන්න.
    # '8000' වෙනුවට ඒක run වෙන port එක දෙන්න.
    command: tunnel --url http://gateway:8000
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rcp-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: rcp
      RABBITMQ_DEFAULT_PASS: rcp_local_pw
      RABBITMQ_DEFAULT_VHOST: rcp
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Topology (exchanges, quorum queues, DLX) is declared idempotently by
    # the services on startup; rabbitmq/definitions.json is the same
    # topology for importing into a managed cluster in production.

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    environment:
      ENVIRONMENT: local
      IAM_URL: http://iam:8000
      LOGISTICS_URL: http://logistics:8000
      ANALYTICS_URL: http://analytics:8000
      VOLUNTEER_URL: http://volunteer:8000
      RTO_URL: http://rto:8080
    ports: ["8000:8000"]
    depends_on:
      iam: { condition: service_started }
      logistics: { condition: service_started }
      analytics: { condition: service_started }
      volunteer: { condition: service_started }

  iam:
    build:
      context: ../..
      dockerfile: services/iam/Dockerfile
    environment:
      <<: *common-env
      #:when you do a alembic migration please change database url from port 6543 to 5432 because in a migration pool connection(transition mode) not work...it require session mode with port 5432
      # DATABASE_URL: postgresql+psycopg2://postgres.cjhshltpumlvjitlhirv:seneheyathra2026@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require 
      DATABASE_URL: postgresql+psycopg2://postgres.cjhshltpumlvjitlhirv:seneheyathra2026@aws-1-ap-south-1.pooler.supabase.com:6543/postgres 
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_signing_key
    
    container_name: iam-service  #last try meka
    hostname: iam-service        #last try meka

    ports: ["8001:8000"]
    
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


    depends_on:
      # db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    secrets: [jwt_signing_key]

  logistics:
    build:
      context: ../..
      dockerfile: services/logistics/Dockerfile
    environment:
      <<: *common-env
      #DATABASE_URL: postgresql+psycopg2://postgres.cjhshltpumlvjitlhirv:seneheyathra2026@aws-1-ap-south-1.pooler.supabase.com:6543/postgres 
      DATABASE_URL: postgresql+psycopg2://postgres.cjhshltpumlvjitlhirv:seneheyathra2026@aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require 
    ports: ["8002:8000"]  
    depends_on:
      # db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      iam: { condition: service_started }

  analytics:
    build:
      context: ../..
      dockerfile: services/analytics/Dockerfile
    environment:
      <<: *common-env
    ports: ["8003:8000"]
    depends_on:
      # db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      iam: { condition: service_started }
      logistics: { condition: service_started }

  volunteer:

    volumes:
    - ../../services/volunteer/migrations:/srv/migrations
    build:
      context: ../..
      dockerfile: services/volunteer/Dockerfile
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+psycopg2://postgres.cjhshltpumlvjitlhirv:seneheyathra2026@aws-1-ap-south-1.pooler.supabase.com:6543/postgres 


    ports: ["8004:8000"]
    depends_on:
      # db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      iam: { condition: service_started }

  rto:
    build: ../../services/rto
    environment:
      <<: *common-env
      # iam-service:8000 uses internal port 8000 of container_name iam-service
      JWT_JWKS_URL: http://iam-service:8000/.well-known/jwks.json
      # JWT_JWKS_URL: http://172.19.0.4:8000/.well-known/jwks.json
      DATABASE_URL: postgres://postgres.cjhshltpumlvjitlhirv:seneheyathra2026@aws-1-ap-south-1.pooler.supabase.com:6543/postgres 

      # extra_hosts:
      #   "iam:172.19.0.4"

      
      
    ports: ["8080:8080"]
    depends_on:
      iam: { condition: service_started }
      # db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      

secrets:
  jwt_signing_key:
    file: ./secrets/jwt_dev_key.pem

volumes:
  pgdata:
  rabbitdata:
