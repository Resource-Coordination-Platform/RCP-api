[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcp-common"
version = "0.1.0"
description = "Shared utilities for RCP services: structured logging, middleware, exceptions, config helpers, JWKS auth."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "pydantic-settings>=2.3",
]

[tool.setuptools.packages.find]
include = ["rcp_common*"]
