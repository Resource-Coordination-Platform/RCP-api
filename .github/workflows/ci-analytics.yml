name: ci-analytics

on:
  pull_request:
    paths:
      - "services/analytics/**"
      - "packages/common/**"
      - "packages/contracts/**"
  push:
    branches: [main]
    paths:
      - "services/analytics/**"
      - "packages/common/**"
      - "packages/contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ../../packages/common
      - run: python -m pytest tests -q
      - name: Verify ORM mappings configure
        run: |
          python -c "import app.models; from sqlalchemy.orm import configure_mappers; configure_mappers()"

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/analytics/Dockerfile -t rcp/analytics:${{ github.sha }} .
