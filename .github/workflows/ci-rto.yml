name: ci-rto

on:
  pull_request:
    paths:
      - "services/rto/**"
      - "packages/contracts/**"
  push:
    branches: [main]
    paths:
      - "services/rto/**"
      - "packages/contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rcp/rto:${{ github.sha }} services/rto
