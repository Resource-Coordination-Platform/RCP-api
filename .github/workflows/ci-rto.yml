name: ci-rto

on:
  pull_request:
    paths:
      - "services/rto/**"
      - "packages/contracts/**"
  push:
    branches: [main]
    paths:
      - "services/rto/**"
      - "packages/contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod tidy
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: docker build -t ${{ steps.login-ecr.outputs.registry }}/rcp/rto:latest services/rto
      - run: docker push ${{ steps.login-ecr.outputs.registry }}/rcp/rto:latest
