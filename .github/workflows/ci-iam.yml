name: ci-iam

on:
  pull_request:
    paths:
      - "services/iam/**"
      - "packages/common/**"
      - "packages/contracts/**"
  push:
    branches: [main]
    paths:
      - "services/iam/**"
      - "packages/common/**"
      - "packages/contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/iam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ../../packages/common
      - run: python -m pytest tests -q
      - name: Verify ORM mappings configure
        run: |
          python -c "import app.models; from sqlalchemy.orm import configure_mappers; configure_mappers()"

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/iam/Dockerfile -t rcp/iam:${{ github.sha }} .
      # push to ECR + update the ECS task definition happens here in the
      # deploy step (see infra/terraform README) — deploys are CI, not TF
