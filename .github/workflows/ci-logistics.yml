name: ci-logistics

on:
  pull_request:
    paths:
      - "services/logistics/**"
      - "packages/common/**"
      - "packages/contracts/**"
  push:
    branches: [main]
    paths:
      - "services/logistics/**"
      - "packages/common/**"
      - "packages/contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/logistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ../../packages/common
      - run: python -m pytest tests -q
      - name: Verify ORM mappings configure
        run: |
          python -c "import app.models; from sqlalchemy.orm import configure_mappers; configure_mappers()"

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: docker build -f services/logistics/Dockerfile -t ${{ steps.login-ecr.outputs.registry }}/rcp/logistics:latest .
      - run: docker push ${{ steps.login-ecr.outputs.registry }}/rcp/logistics:latest
